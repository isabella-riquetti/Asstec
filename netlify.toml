# Security headers apply everywhere. Cache-Control here is the safe default:
# HTML (and anything not overridden below) must revalidate, so content and SEO
# changes go live immediately instead of sitting stale in the CDN for a month.
#
# No no-store anywhere on purpose: the whole site is public, static and
# anonymous -- no login, no forms, no personal data in any response. no-store
# would only forbid the browser from reusing bytes it is welcome to reuse.
# If a private page is ever added (an area behind login, an order status),
# give that path its own block:
#
#   [[headers]]
#     for = "/area-restrita/*"
#     [headers.values]
#       Cache-Control = "no-store, max-age=0"
#
# Content-Security-Policy notes, directive by directive:
#   default-src 'self'    everything not listed below may only come from
#                         comifer.com.br.
#   script-src            the single sha256 value is the one inline <script>
#                         block left in index.html: the reveal-on-scroll flag
#                         in the <head>. EDITING THAT BLOCK -- even the
#                         indentation -- INVALIDATES THE HASH AND THE BROWSER
#                         SILENTLY STOPS RUNNING IT. Recompute with
#                         `node tools/csp-hashes.mjs` and paste the output here.
#                         No 'unsafe-inline' and no 'unsafe-eval': injected
#                         <script> tags simply do not execute, which is the
#                         whole point of the header.
#   style-src             fonts.googleapis.com serves the Barlow stylesheet.
#                         No 'unsafe-inline', so style="" attributes in the
#                         HTML are blocked too -- that is why the rating stars
#                         and the small mono captions use .stars--47 and
#                         .mono--xs in css/redesign.css instead. Animating via
#                         element.style in JS (anime.js, js/redesign.js) is
#                         CSSOM, not an inline style, and keeps working.
#   font-src              fonts.gstatic.com serves the Barlow files.
#   img/connect-src       'self' only, and it stays that way. The site runs
#                         Netlify Web Analytics, which is read server-side
#                         from the CDN request logs -- no script tag, no
#                         beacon, no cookie, so there is nothing to allow
#                         here and no LGPD consent banner to show. Enable or
#                         cancel it in the Netlify UI under Logs & Metrics >
#                         Analytics; the repo needs no change either way.
#                         Before swapping in a client-side tracker (GA4,
#                         Plausible, Cloudflare), note the cost: entries in
#                         script-src AND connect-src, plus every visitor
#                         running an adblocker goes uncounted.
#   frame-ancestors       same rule as X-Frame-Options below, for browsers
#                         that honour CSP instead of the legacy header.
#   base-uri/object-src   kill <base href> hijacking and plugin embeds.
#
# The <script type="application/ld+json"> blocks need no hash: a data block is
# never executed, so CSP does not check it.
#
# To try a change without risking a broken page, ship it as
# Content-Security-Policy-Report-Only first -- the browser console reports what
# WOULD have been blocked (and prints the hash it expected) while the current
# enforcing header stays in place. Keep both headers only while testing.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-S+K5BE3Dsfz7jf/b26IZB6NMiiIeLgdeQ/snsZLFhTw='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # Legacy header for the browsers that still ship the XSS auditor. Chrome,
    # Edge and Safari removed theirs years ago and ignore this line; Firefox
    # never had one. CSP above is what actually stops injected script today.
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# CSS and JS are served from stable, unfingerprinted paths (/css/main.css etc.),
# so they inherit the revalidating default above on purpose -- a long max-age
# would strand users on old assets after a deploy. Revalidation is a cheap 304.

# Images change rarely and are safe to hold for a month.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2628000"

# Fonts are immutable in practice.
[[headers]]
  for = "/webfonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Icons and manifest: long enough to be cheap, short enough that a rebrand
# propagates within a week.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"
